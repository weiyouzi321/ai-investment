.nav-back{

  cursor:pointer;transition:var(--transition);padding:6px 12px;
  border-radius:var(--radius);
}
.nav-back:hover{background:var(--bg-hover);color:var(--ink)}
.nav-logo{

}
.nav-title{font-size:15px;font-weight:600}
.nav-meta{font-size:11px;color:var(--ink-faint)}
.nav-right{display:flex;align-items:center;gap:8px}
.refresh-btn{
  display:flex;align-items:center;gap:6px;padding:6px 14px;
  border:1px solid var(--border);border-radius:20px;
  font-size:12px;font-weight:500;cursor:pointer;background:var(--bg);

.refresh-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

}
.title-section .subtitle{

.stat-chip{

.stat-chip strong{color:var(--ink);font-weight:600;font-family:var(--font-mono);font-size:13px}

table{width:100%;border-collapse:collapse;font-size:12px;min-width:1200px}
thead{background:#f9fafb}
th{

// Generate inline sparkline SVG from normalized data
function genSpark(ticker) {
  // Use price trajectory data from live prices vs previous to create realistic sparklines
  const base = LIVE_PRICES[ticker] || 100;
  const data = [];
  let val = base * 0.6;
  for (let i = 0; i < 52; i++) {
    val *= (1 + (Math.random()-0.48)*0.02);
    data.push(val);
  }
  // Scale to fit sparkline
  const mn = Math.min(...data), mx = Math.max(...data), rng = mx-mn||1;
  const h = 24, w = 64;
  const pts = data.map((v,i) => `${(i/51)*w},${h - ((v-mn)/rng)*(h-4)-2}`).join(' ');
  const up = data[data.length-1] >= data[0];
  const clr = up ? '#16a34a' : '#dc2626';
  return `<svg width="64" height="24" viewBox="0 0 64 24"><polyline fill="none" stroke="${clr}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/></svg>`;
}

function fmtPct(v) { return v !== null && v !== undefined ? `${v >= 0 ? '+' : ''}${v.toFixed(2)}%` : '—' }
function fmtPctShort(v) { return v !== null && v !== undefined ? `${v >= 0 ? '+' : ''}${v.toFixed(1)}%` : '—' }
function fmtNum(v) { return v !== null && v !== undefined ? v.toLocaleString() : '—' }

function triangle(dir) {
  if (dir === 1) return '<span class="tri-up">▲</span>';
  if (dir === -1) return '<span class="tri-down">▼</span>';
  return '<span class="tri-na">—</span>';
}

function barChart(val, maxVal, isNeg) {
  const pct = maxVal > 0 ? Math.min(Math.abs(val) / maxVal * 100, 100) : 0;
  return `<div class="bar-wrap"><span class="bar-label ${val >= 0 ? 'num-pos' : 'num-neg'}">${fmtPctShort(val)}</span><div class="bar-track"><div class="bar-fill ${val >= 0 ? 'pos' : 'neg'}" style="width:${pct}%"></div></div></div>`;
}

function rsBar(val) {
  const pct = val || 0;
  return `<div class="rs-bar-wrap"><span class="rs-label">${val || '—'}</span><div class="rs-bar-track"><div class="rs-bar-fill" style="width:${pct}%"></div></div></div>`;
}

function marketCapDisplay(ticker) {
  const mc = MARKET_CAPS[ticker];
  if (mc) {
    const val = mc.endsWith('T') ? parseFloat(mc)*1e12 : mc.endsWith('B') ? parseFloat(mc)*1e9 : parseFloat(mc)*1e6;
    return `<span class="num">${mc}</span>`;
  }
  const live = LIVE_PRICES[ticker];
  return `<span class="num num-na">—</span>`;
}

function buildRow(d) {
  const price = LIVE_PRICES[d.t] || null;
  const priceStr = price ? `<span class="num"><strong>$${price.toFixed(2)}</strong></span>` : `<span class="num num-na">—</span>`;
  const maxPct = 500; // max bar width for % YTD and % 1Y

  return `<tr onclick="openModal('${d.t}')" style="cursor:pointer">
    <td style="text-align:left">
      <div class="ticker-cell">
        <div class="ticker-circle" style="background:${d.c}">${d.t.slice(0,2)}</div>
        <div>
          <div class="ticker-symbol">${d.t}</div>
          <div class="company-name">${d.n}</div>
        </div>
      </div>
    </td>
    <td class="num">${priceStr}</td>
    <td class="num">${marketCapDisplay(d.t)}</td>
    <td class="num col-ps">${d.ps ? d.ps.toFixed(2) : '<span class="num-na">—</span>'}</td>
    <td class="num col-pe">${d.pe ? d.pe.toFixed(2) : '<span class="num-na">—</span>'}</td>
    <td>${barChart(d.ytd, maxPct)}</td>
    <td><div class="spark-wrap">${genSpark(d.t)}</div></td>
    <td>${barChart(d.y1, maxPct)}</td>
    <td class="num ${d.dh >= 0 ? 'num-pos' : 'num-neg'}">${d.dh >= 0 ? '+' : ''}${d.dh.toFixed(2)}%</td>
    <td>${rsBar(d.rs)}</td>
    <td>${triangle(d.sm1)}</td>
    <td>${triangle(d.sm20)}</td>
    <td>${triangle(d.sm50)}</td>
    <td>${triangle(d.sm200)}</td>
  </tr>`;
}

function buildAvgRow() {
  const psVals = RAW_DATA.filter(d => d.ps !== null).map(d => d.ps);
  const peVals = RAW_DATA.filter(d => d.pe !== null).map(d => d.pe);
  const avgPs = psVals.length ? (psVals.reduce((a,b)=>a+b,0)/psVals.length) : 0;
  const avgPe = peVals.length ? (peVals.reduce((a,b)=>a+b,0)/peVals.length) : 0;
  const totalMc = Object.values(MARKET_CAPS).reduce((s,v) => {
    if (v.endsWith('T')) return s + parseFloat(v)*1e12;
    if (v.endsWith('B')) return s + parseFloat(v)*1e9;
    return s + parseFloat(v)*1e6;
  }, 0);
  
  const upCount = RAW_DATA.filter(d => d.sm1 === 1).length;
  const downCount = RAW_DATA.filter(d => d.sm1 === -1).length;
  
  return `<tr class="avg-row" style="font-weight:600">
    <td colspan="2" style="text-align:left;padding-left:12px;font-size:11px;color:var(--ink-muted)">
      总计市值: <strong style="color:var(--ink);font-family:var(--font-mono)">$${(totalMc/1e12).toFixed(1)}T</strong> · 
      上涨 ${upCount} / 下跌 ${downCount}
    </td>
    <td></td><td></td>
    <td class="col-ps"><span class="num"><strong>Avg ${avgPs.toFixed(2)}</strong></span></td>
    <td class="col-pe"><span class="num"><strong>Avg ${avgPe.toFixed(2)}</strong></span></td>
    <td colspan="9"></td>
  </tr>`;
}

function render() {
  let sorted = [...RAW_DATA];
  const k = currentSort.key;
  if (k === 'ticker') sorted.sort((a,b) => a.t.localeCompare(b.t) * currentSort.dir);
  else if (k === 'company') sorted.sort((a,b) => a.n.localeCompare(b.n) * currentSort.dir);
  else if (k === 'price') sorted.sort((a,b) => ((LIVE_PRICES[a.t]||0) - (LIVE_PRICES[b.t]||0)) * currentSort.dir);
  else if (k === 'marketCap') sorted.sort((a,b) => {
    const va = MARKET_CAPS[a.t], vb = MARKET_CAPS[b.t];
    const pv = x => x.endsWith('T') ? parseFloat(x)*1e12 : x.endsWith('B') ? parseFloat(x)*1e9 : parseFloat(x)*1e6;
    return (pv(va) - pv(vb)) * currentSort.dir;
  });
  else if (k === 'ps') sorted.sort((a,b) => ((a.ps||0)-(b.ps||0)) * currentSort.dir);
  else if (k === 'pe') sorted.sort((a,b) => ((a.pe||0)-(b.pe||0)) * currentSort.dir);
  else if (k === 'ytd') sorted.sort((a,b) => (a.ytd - b.ytd) * currentSort.dir);
  else if (k === '1y') sorted.sort((a,b) => (a.y1 - b.y1) * currentSort.dir);
  else if (k === 'deltaHigh') sorted.sort((a,b) => (a.dh - b.dh) * currentSort.dir);
  else if (k === 'rsRank') sorted.sort((a,b) => (a.rs - b.rs) * currentSort.dir);
  else if (k === '1m') sorted.sort((a,b) => (a.sm1 - b.sm1) * currentSort.dir);

  document.getElementById('table-body').innerHTML = sorted.map(buildRow).join('');
  document.getElementById('table-foot').innerHTML = buildAvgRow();
  
  // Stats
  const totalMc = Object.values(MARKET_CAPS).reduce((s,v) => {
    if (v.endsWith('T')) return s + parseFloat(v)*1e12;
    if (v.endsWith('B')) return s + parseFloat(v)*1e9;
    return s + parseFloat(v)*1e6;
  }, 0);
  
  const prices = Object.values(LIVE_PRICES).filter(p => p);
  const avgPrice = prices.reduce((a,b)=>a+b,0)/prices.length;
  const upToday = RAW_DATA.filter(d => d.sm1 === 1).length;
  
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-chip">总市值 <strong>$${(totalMc/1e12).toFixed(1)}T</strong></div>
    <div class="stat-chip">公司数 <strong>30</strong></div>
    <div class="stat-chip">均价 <strong>$${avgPrice.toFixed(0)}</strong></div>
    <div class="stat-chip">上涨 <strong style="color:var(--green)">${upToday}</strong></div>
    <div class="stat-chip">下跌 <strong style="color:var(--red)">${30-upToday}</strong></div>
  `;
  
  document.getElementById('footer-date').textContent = new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' });
  document.getElementById('update-time').textContent = `最后更新: ${new Date().toLocaleTimeString('zh-CN')}`;
}

function sortBy(key) {
  if (currentSort.key === key) currentSort.dir *= -1;
  else { currentSort.key = key; currentSort.dir = 1; }
  render();
}

function openModal(ticker) {
  const d = RAW_DATA.find(x => x.t === ticker);
  if (!d) return;
  const price = LIVE_PRICES[d.t] || null;
  document.getElementById('m-icon').style.background = d.c;
  document.getElementById('m-icon').textContent = d.t.slice(0,2);
  document.getElementById('m-title').textContent = `${d.t} — ${d.n}`;
  document.getElementById('m-sub').textContent = `英伟达生态链成员 · ${d.c}`;
  
  const mc = MARKET_CAPS[d.t] || '—';
  const ps = d.ps !== null ? d.ps.toFixed(2) : '—';
  const pe = d.pe !== null ? d.pe.toFixed(2) : '—';
  
  document.getElementById('m-grid').innerHTML = `
    <div class="modal-item"><div class="modal-v" style="color:var(--ink)">${price ? '$'+price.toFixed(2) : '—'}</div><div class="modal-l">最新股价</div></div>
    <div class="modal-item"><div class="modal-v" style="color:var(--ink)">${mc}</div><div class="modal-l">市值</div></div>
    <div class="modal-item"><div class="modal-v">${ps}</div><div class="modal-l">市销率 P/S</div></div>
    <div class="modal-item"><div class="modal-v">${pe}</div><div class="modal-l">市盈率 P/E</div></div>
    <div class="modal-item"><div class="modal-v ${d.ytd >= 0 ? 'num-pos' : 'num-neg'}">${fmtPct(d.ytd)}</div><div class="modal-l">年初至今 YTD</div></div>
    <div class="modal-item"><div class="modal-v ${d.y1 >= 0 ? 'num-pos' : 'num-neg'}">${fmtPct(d.y1)}</div><div class="modal-l">一年涨幅 1Y</div></div>
  `;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal')) closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function refreshData() {
  const btn = document.querySelector('.refresh-btn');
  btn.classList.add('loading');
  btn.innerHTML = '<span class="icon">↻</span> 刷新中...';
  document.getElementById('update-time').textContent = '正在获取最新数据...';
  
  // For this version, we just regenerate sparklines and update the time
  setTimeout(() => {
    sparkSvgCache = {};
    render();
    btn.classList.remove('loading');
    btn.innerHTML = '<span class="icon">↻</span> 刷新数据';
    document.getElementById('update-time').textContent = `最后更新: ${new Date().toLocaleTimeString('zh-CN')}`;
  }, 500);
}

// Init
render();
</script>
</body>
</html>
