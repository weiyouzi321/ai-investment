  <script>
    (function() {
      const root = document.getElementById('weeks-root');
      const weeksEl = document.getElementById('weeks');
      const videosEl = document.getElementById('videos');
      const updatedEl = document.getElementById('last-updated');

      let data = null;
      try {
        const embedded = document.getElementById('playlist-data');
        const source = embedded ? embedded.textContent : null;
        data = source ? JSON.parse(source) : null;
      } catch (e) { data = null; }

      if (!data || !Array.isArray(data.weeks)) {
        root.innerHTML = '<div class="empty">无法读取课程数据。</div>';
        return;
      }

      render(data);

      function render(src) {
        if (!src) {
          root.innerHTML = '<div class="empty">无效数据格式。</div>';
          return;
        }
        const weeks = Array.isArray(src.weeks) ? src.weeks : [];
        weeksEl.textContent = weeks.length;
        const total = weeks.reduce((s, w) => s + (Array.isArray(w.videos) ? w.videos.length : 0), 0);
        videosEl.textContent = total;
        updatedEl.textContent = src.generated_at || '—';

        if (!weeks.length) {
          root.innerHTML = '<div class="empty">暂无周次数据。</div>';
          return;
        }

        const frag = document.createDocumentFragment();
        weeks.forEach((w, idx) => {
          const vids = Array.isArray(w.videos) ? w.videos : [];
          const week = document.createElement('div');
          week.className = 'week';

          const header = document.createElement('div');
          header.className = 'week-header';
          header.innerHTML = '<div><div class="week-title">' + escapeHtml((w.title || ('Week ' + w.week))) + '</div><div class="week-count">' + vids.length + ' 个视频</div></div><div class="week-count">▸</div>';
          header.addEventListener('click', function() {
            const open = week.classList.toggle('open');
            header.querySelector('.week-count').textContent = open ? '▾' : '▸';
          });
          week.appendChild(header);

          const body = document.createElement('div');
          body.className = 'week-body';
          if (!vids.length) {
            body.innerHTML = '<div class="empty">本周期无视频</div>';
          } else {
            vids.forEach(function(v) {
              const row = document.createElement('div');
              row.className = 'video';
              const url = (typeof v === 'string') ? v : (v.url || ('https://www.bilibili.com/video/' + (v.bvid || '')));
              const title = (typeof v === 'string') ? v : (v.title || 'Untitled');
              const bvid = (typeof v === 'string') ? '' : (v.bvid || '');
              const duration = (typeof v === 'string') ? '' : (v.duration || '');
              row.innerHTML =
                '<div class="video-left"><div class="video-title">' + escapeHtml(title) + '</div>' +
                '<div class="video-meta">' + escapeHtml(bvid) + (duration ? (' · ' + escapeHtml(duration)) : '') + '</div></div>' +
                '<a class="video-link" href="' + escapeHtml(url) + '" target="_blank" rel="noopener"><span>Bilibili</span>' + escapeHtml(bvid) + '</a>';
              body.appendChild(row);
            });
          }
          week.appendChild(body);
          frag.appendChild(week);
        });
        root.appendChild(frag);
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
    })();
  </script>
