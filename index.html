const LAYER_COLORS = ["#8e44ad", "#27ae60", "#2980b9", "#f39c12", "#e67e22", "#c0392b", "#2c3e50", "#16a085"];

// ========== HELPERS ==========
function fmt(num, suffix='', prefix='') {
  if (num == null) return '<span class="num-na">—</span>';
  return `<span class="num">${prefix}${Number(num).toFixed(2)}${suffix}</span>`;
}

function fmtMC(mc) {
  if (!mc) return '<span class="num-na">—</span>';
  if (mc >= 1e12) return `<span class="num">$${(mc/1e12).toFixed(1)}T</span>`;
  if (mc >= 1e9) return `<span class="num">$${(mc/1e9).toFixed(1)}B</span>`;
  return `<span class="num">$${(mc/1e6).toFixed(1)}M</span>`;
}

function pct(v) {
  if (v == null) return '<span class="num-na">—</span>';
  const cls = v >= 0 ? 'num-pos' : 'num-neg';
  const sign = v >= 0 ? '+' : '';
  return `<span class="num ${cls}">${sign}${v.toFixed(2)}%</span>`;
}

function getLayerName(layer) {
  const l = LAYERS.find(x => x.id === layer);
  return l ? l.name : '未知';
}

function getLayerIcon(layer) {
  const l = LAYERS.find(x => x.id === layer);
  return l ? l.icon : '❓';
}

function getLayerColor(layer) {
  return LAYER_COLORS[layer] || '#666';
}

// ========== RENDER STATS ==========
function renderStats(companies) {
  const totalMC = companies.reduce((s, c) => s + (c.financial?.marketCapVal || 0), 0);
  const psVals = companies.filter(c => c.financial?.ps != null).map(c => c.financial.ps);
  const peVals = companies.filter(c => c.financial?.pe != null).map(c => c.financial.pe);
  const avgPS = psVals.length ? (psVals.reduce((a,b) => a+b, 0) / psVals.length).toFixed(2) : '—';
  const avgPE = peVals.length ? (peVals.reduce((a,b) => a+b, 0) / peVals.length).toFixed(2) : '—';
  
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-card">
      <div class="stat-value" style="color:var(--accent)">${companies.length}</div>
      <div class="stat-label">生态链公司</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">$${(totalMC/1e12).toFixed(1)}T</div>
      <div class="stat-label">总市值</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${avgPS}x</div>
      <div class="stat-label">平均 P/S</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${avgPE}x</div>
      <div class="stat-label">平均 P/E</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--green)">${LAYERS.length}</div>
      <div class="stat-label">生态层级</div>
    </div>
  `;
}

// ========== RENDER FLOW ==========
function renderFlow() {
  const container = document.getElementById('flow-nodes');
  let html = '';
  LAYERS.forEach((layer, i) => {
    const count = COMPANIES.filter(c => c.ecosystemLayer === layer.id).length;
    if (i > 0) html += '<div class="flow-arrow">→</div>';
    html += `
      <div class="flow-node" style="background:${getLayerColor(layer.id)}22; border: 1px solid ${getLayerColor(layer.id)}44" onclick="filterLayer(${layer.id})">
        <div class="flow-node-icon">${layer.icon}</div>
        <div class="flow-node-name">${layer.name}</div>
        <div class="flow-node-count">${count} 家公司</div>
        <div style="font-size:10px;color:var(--ink-faint);margin-top:2px">${layer.desc}</div>
      </div>
    `;
  });
  container.innerHTML = html;
}

// ========== RENDER TABLE ==========
let currentFilter = 'all';
let currentSort = 'name';
let searchTerm = '';

function renderTable(companies) {
  let filtered = [...companies];
  
  // Filter by layer
  if (currentFilter !== 'all') {
    filtered = filtered.filter(c => c.ecosystemLayer === parseInt(currentFilter));
  }
  
  // Search
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    filtered = filtered.filter(c => 
      c.ticker.toLowerCase().includes(q) ||
      c.company.toLowerCase().includes(q) ||
      (c.cn && c.cn.toLowerCase().includes(q))
    );
  }
  
  // Sort
  const [key, dir] = currentSort.split('-');
  filtered.sort((a, b) => {
    let va, vb;
    if (key === 'name') {
      va = a.ticker; vb = b.ticker;
      return va.localeCompare(vb);
    }
    if (key === 'mcap') {
      va = a.financial?.marketCapVal || 0;
      vb = b.financial?.marketCapVal || 0;
    } else if (key === 'price') {
      va = a.financial?.price || 0;
      vb = b.financial?.price || 0;
    } else if (key === 'ps') {
      va = a.financial?.ps || 0;
      vb = b.financial?.ps || 0;
    } else if (key === 'pe') {
      va = a.financial?.pe || 99999;
      vb = b.financial?.pe || 99999;
    } else {
      va = a.financial?.[key] != null ? a.financial[key] : -99999;
      vb = b.financial?.[key] != null ? b.financial[key] : -99999;
    }
    return dir === 'asc' ? va - vb : vb - va;
  });
  
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = filtered.map(c => {
    const f = c.financial || {};
    const color = getLayerColor(c.ecosystemLayer);
    return `
      <tr onclick="openModal('${c.ticker}')">
        <td>
          <div class="ticker-cell">
            <div class="layer-indicator" style="background:${color}"></div>
            <div>
              <div class="ticker-badge">${c.ticker}</div>
              <div class="company-name" style="font-size:11px;color:var(--ink-muted)">${c.company}</div>
            </div>
          </div>
        </td>
        <td class="num-cell">${f.price != null ? '<span class="num">$'+f.price.toFixed(2)+'</span>' : '<span class="num-na">—</span>'}</td>
        <td class="num-cell">${fmtMC(f.marketCapVal)}</td>
        <td class="num-cell">${f.ps != null ? fmt(f.ps, 'x') : '<span class="num-na">—</span>'}</td>
        <td class="num-cell">${f.pe != null ? fmt(f.pe, 'x') : '<span class="num-na">—</span>'}</td>
        <td class="num-cell">${pct(f.ytd)}</td>
        <td class="num-cell">${pct(f['1y'])}</td>
        <td>
          <span class="category-badge" style="background:${color}22; color:${color}">
            ${getLayerIcon(c.ecosystemLayer)} ${getLayerName(c.ecosystemLayer)}
          </span>
        </td>
      </tr>
    `;
  }).join('');
}

          <div class="modal-fin-val">${f.ps != null ? f.ps.toFixed(2)+'x' : '—'}</div>
          <div class="modal-fin-lbl">P/S</div>
        </div>
        <div class="modal-fin-item">
          <div class="modal-fin-val">${f.pe != null ? f.pe.toFixed(2)+'x' : '—'}</div>

    </div>
    
    <div class="modal-section">
      <div class="modal-section-title">🔬 核心产品</div>
      <div class="modal-products">
        ${(c.products || []).map(p => '<span class="product-tag">'+p+'</span>').join('')}
      </div>

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Close on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ========== FILTERS ==========
function filterLayer(layer) {
  currentFilter = layer.toString();
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.layer === currentFilter);
  });
  renderTable(COMPANIES);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => filterLayer(btn.dataset.layer));
});

// ========== SEARCH ==========
document.getElementById('search-input').addEventListener('input', function() {
  searchTerm = this.value;
  renderTable(COMPANIES);
});

// ========== SORT ==========
document.getElementById('sort-select').addEventListener('change', function() {
  currentSort = this.value;
  renderTable(COMPANIES);
});

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', function() {
    const key = this.dataset.sort;
    const sel = document.getElementById('sort-select');
    // Toggle direction
    const opts = ['ytd','1y','mcap','ps','pe','name'];
    if (opts.includes(key)) {
      sel.value = key;
      currentSort = key;
      renderTable(COMPANIES);
    }
  });
});

// ========== INIT ==========
document.getElementById('header-date').textContent = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });

renderTable(COMPANIES);
