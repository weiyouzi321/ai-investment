<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Investment</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛</text></svg>" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1c212c;
    --border: #2a303b;
    --text: #e6e9f0;
    --muted: #9aa0a8;
    --accent: #7aa2ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(122,162,255,0.08), transparent) ,
      radial-gradient(1000px 800px at 120% 20%, rgba(122,162,255,0.06), transparent) ,
      var(--bg);
    color: var(--text);
  }
  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 36px 28px 60px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 28px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .brand h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .brand .sub {
    color: var(--muted);
    font-size: 13px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .search {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    min-width: 260px;
    outline: none;
  }
  .search::placeholder { color: #8a919b; }
  .chip-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
  }
  .chip-btn.active {
    color: #fff;
    border-color: rgba(122,162,255,0.45);
    background: rgba(122,162,255,0.12);
  }
  .ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 16px;
  }
  .section {
    grid-column: span 4;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .section:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .section-head h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: #ffe7a0;
  }
  .section-head .count {
    color: var(--muted);
    font-size: 12px;
    background: rgba(255,255,255,0.04);
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 10px;
    border-radius: 10px;
    font-size: 12px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    transition: border-color 120ms ease, background 120ms ease;
  }
  .link:hover {
    border-color: rgba(122,162,255,0.55);
    background: #1f2633;
  }
  .link .name {
    font-size: 14px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .link .icon::after {
    content: "↗";
    color: var(--accent);
    font-weight: 700;
  }
  .hidden { display: none !important; }

  @media (max-width: 860px) {
    .section { grid-column: span 6; }
  }
  @media (max-width: 520px) {
    .section { grid-column: span 12; }
    .search { min-width: 220px; width: 100%; }
    header { flex-direction: column; align-items: flex-start; }
  }

  <style>
    .site-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      background: rgba(15,17,21,0.85); backdrop-filter: blur(6px);
      position: sticky; top: 0; z-index: 50;
    }
    .site-nav .brand {
      font-weight: 700; font-size: 15px; color: var(--text); letter-spacing: 0.2px;
    }
    .site-nav .links a {
      color: var(--muted); font-size: 13px; text-decoration: none; margin-left: 14px;
    }
    .site-nav .links a:hover, .site-nav .links a.active { color: var(--accent); }
  </style>
</style>
</head>
<body>

  <nav class="site-nav">
    <div class="brand">AI Investment</div>
    <div class="links">
      <a href="course/index.html" class="active">MS&E 435</a>
      <a href="ecosystem/index.html">AI 产业链</a>
      <a href="dashboard/index.html">数据面板</a>
      <a href="money-banking/index.html">货币金融学</a>
    </div>
  </nav>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>AI Investment</h1>
      <span class="sub">Home · Index</span>
    </div>
    <div class="controls">
      <input class="search" id="q" placeholder="搜索入口或关键词…" />
      <button class="ghost" id="openAll">Open all</button>
      <a class="ghost" href="money-banking/index.html" target="_blank">货币金融学</a>
    </div>
  </header>

  <div class="grid" id="sections"></div>
</div>

<script>
  const projects = {
    "课程翻译": [
      { name: "货币金融学", url: "money-banking/index.html" },
    ],
    "产业链": [],
    "数据面板": []
  };

  const colors = {
    "课程翻译": "#d8b4fe",
    "产业链": "#93c5fd",
    "数据面板": "#86efac"
  };

  const sectionEl = document.getElementById('sections');
  const qEl = document.getElementById('q');
  const openAllBtn = document.getElementById('openAll');

  qEl.addEventListener('input', filter);
  openAllBtn.addEventListener('click', () => {
    document.querySelectorAll('.link').forEach(a => a.target = '_blank');
  });

  render(Object.entries(projects));

  function render(items) {
    sectionEl.innerHTML = '';
    for (const [key, links] of items) {
      const filtered = links.filter(l => visible(l, qEl.value));
      const card = document.createElement('section');
      card.className = 'section';
      card.dataset.key = key;

      const tags = [];
      if (links.some(l => /bilibili|b站|b 站|bvid/i.test(l.name + ' ' + l.url))) tags.push('Bilibili');
      if (links.some(l => /pdf|论文|paper/i.test(l.name + ' ' + l.url))) tags.push('PDF');
      if (links.some(l => /python|script|脚本/i.test(l.name + ' ' + l.url))) tags.push('Script');

      card.innerHTML = `
        <div class="section-head">
          <h2>${esc(key)}</h2>
          <span class="count">${filtered.length}/${links.length}</span>
        </div>
        ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        <div class="links"></div>
      `;

      const list = card.querySelector('.links');
      for (const l of filtered) {
        const a = document.createElement('a');
        a.className = 'link';
        a.href = esc(l.url);
        a.target = '_self';
        a.title = l.name;
        a.dataset.name = l.name;
        a.dataset.url = l.url;
        a.innerHTML = `
          <span class="name">${esc(l.name)}</span>
          <span class="icon"></span>
        `;
        list.appendChild(a);
      }
      sectionEl.appendChild(card);
    }
  }

  function visible(link, q) {
    const s = (link.name + ' ' + link.url).toLowerCase();
    if (!q) return true;
    return s.includes(q.toLowerCase().trim());
  }

  function filter() {
    const cards = Array.from(sectionEl.children);
    let any = false;
    for (const card of cards) {
      const links = Array.from(card.querySelectorAll('.link'));
      let count = 0;
      links.forEach(a => {
        if (visible(a.dataset, qEl.value)) {
          a.classList.remove('hidden');
          count++;
        } else {
          a.classList.add('hidden');
        }
      });
      const countEl = card.querySelector('.count');
      if (countEl) countEl.textContent = `${count}/${links.length}`;
      if (count > 0) {
        card.classList.remove('hidden');
        any = true;
      } else {
        card.classList.add('hidden');
      }
    }
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
</script>
</body>
</html>
